<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- ไม่ให้ Search Engine ทำดัชนี -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">

  <title>Game List</title>


  <style>

    :root {
      --bg: #121212;
      --surface: #1c1c1c;
      --surface-2: #242424;
      --surface-3: #303030;

      --text: #f4f1eb;
      --muted: #aaa49c;

      --accent: #d65a6f;

      --line: #373737;
      --white: #ffffff;
    }


    * {
      box-sizing: border-box;
    }


    html {
      color-scheme: dark;
    }


    body {
      margin: 0;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        Tahoma,
        sans-serif;
    }


    /* ========================================
       HEADER
       ======================================== */

    header {
      padding: 28px 16px 16px;
      text-align: center;
    }


    header h1 {
      margin: 0;

      color: var(--text);

      font-size: 40px;
      font-weight: 850;

      line-height: 1.1;

      letter-spacing: -0.02em;
    }


    /* ========================================
       MAIN
       ======================================== */

    main {
      width: 100%;

      padding:
        0 16px 60px;
    }


    /* ========================================
       FILTER
       ======================================== */

    .filter-panel {
      width: 100%;

      margin:
        12px auto 30px;

      padding: 14px;

      border:
        1px solid var(--line);

      border-radius: 14px;

      background:
        var(--surface);

      box-shadow:
        0 8px 24px rgba(0,0,0,.18);
    }


    .search-box {
      width: 100%;

      margin-bottom: 10px;
    }


    .search-box input {
      width: 100%;

      height: 46px;

      padding:
        0 14px;

      border:
        1px solid #444;

      border-radius: 10px;

      outline: none;

      background:
        var(--surface-2);

      color:
        var(--text);

      font-family: inherit;

      font-size: 16px;
    }


    .search-box input::placeholder {
      color: #888;
    }


    .search-box input:focus {
      border-color:
        var(--accent);
    }


    .filter-row {
      display: grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap: 8px;
    }


    .filter-select {
      width: 100%;

      height: 42px;

      padding:
        0 10px;

      border:
        1px solid #444;

      border-radius: 9px;

      outline: none;

      background:
        var(--surface-2);

      color:
        var(--text);

      font-family: inherit;

      font-size: 14px;
    }


    .filter-select:focus {
      border-color:
        var(--accent);
    }


    .filter-footer {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-top: 11px;
    }


    .result-count {
      color:
        var(--muted);

      font-size: 13px;
    }


    .reset-button {
      padding:
        7px 12px;

      border:
        1px solid #555;

      border-radius: 999px;

      background:
        transparent;

      color:
        #ddd;

      font-family: inherit;

      font-size: 13px;

      cursor: pointer;
    }


    .reset-button:hover {
      border-color:
        var(--accent);

      color: #fff;
    }


    /* ========================================
       SERIES
       ======================================== */

    .series {
      margin-top: 36px;
    }


    .series:first-child {
      margin-top: 0;
    }


    .series-banner {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 12px;

      width: 100%;

      margin-bottom: 18px;

      padding:
        14px 16px;

      border:
        1px solid rgba(255,255,255,.10);

      border-radius: 10px;

      background:
        linear-gradient(
          110deg,
          #7b2434 0%,
          #5b2747 48%,
          #292542 100%
        );

      color:
        var(--white);

      box-shadow:
        0 6px 18px
        rgba(123,36,52,.22);
    }


    .series-banner h2 {
      margin: 0;

      color:
        var(--white);

      font-size: 23px;
      font-weight: 800;

      line-height: 1.2;
    }


    .series-count {
      flex-shrink: 0;

      color:
        rgba(255,255,255,.72);

      font-size: 13px;
      font-weight: 600;
    }


    /* ========================================
       GAME GRID
       MOBILE = 2 ช่องต่อแถว
       ======================================== */

    .game-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0,1fr));

      column-gap: 14px;
      row-gap: 32px;

      align-items: start;
    }


    .game-card {
      min-width: 0;
    }


    /* ========================================
       COVER

       สำคัญ:
       พื้นที่ของแต่ละเกมกว้างเท่ากัน
       แต่ตัวปกจริงไม่ถูกบังคับความกว้าง

       ปกทั้งหมดสูงเท่ากัน
       ======================================== */

    .cover-area {
      width: 100%;

      height: 230px;

      display: flex;

      align-items: flex-end;
      justify-content: center;
    }


    .cover {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: auto;
      max-width: 100%;

      height: 230px;

      overflow: hidden;

      border:
        1px solid #333;

      border-radius: 10px;

      background:
        transparent;

      box-shadow:
        0 5px 18px
        rgba(0,0,0,.32);

      cursor: pointer;

      transition:
        transform .18s ease,
        box-shadow .18s ease;
    }


    .cover:active {
      transform:
        scale(.985);
    }


    .cover img {
      display: block;

      width: auto;
      max-width: 100%;

      height: 100%;

      object-fit: contain;
    }


    /* ========================================
       GAME INFO
       ======================================== */

    .game-info {
      padding-top: 10px;
    }


    .game-title {
      color:
        var(--text);

      font-size: 18px;
      font-weight: 800;

      line-height: 1.3;

      cursor: pointer;
    }


    .game-meta {
      margin-top: 7px;

      color:
        var(--muted);

      font-size: 15px;

      line-height: 1.45;
    }


    .price {
      margin-top: 6px;

      color:
        var(--accent);

      font-size: 17px;
      font-weight: 800;
    }


    /* ========================================
       COMING SOON
       ======================================== */

.coming-soon {
  display: inline-block;

  margin-top: 8px;
  padding: 6px 12px;

  border: 1px solid rgba(255,255,255,.12);
  border-radius: 999px;

  background:
    linear-gradient(
      110deg,
      #176b87 0%,
      #214f78 55%,
      #273e66 100%
    );

  color: #ffffff;

  font-size: 13px;
  font-weight: 800;

  box-shadow:
    0 4px 12px rgba(23,107,135,.25);
}

    /* ========================================
       MESSAGE
       ======================================== */

    .message {
      padding:
        70px 20px;

      text-align: center;

      color:
        var(--muted);

      font-size: 16px;
    }


    .error {
      color:
        #ff7c8d;
    }


    /* ========================================
       MODAL
       ======================================== */

    .modal {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 9999;

      align-items: flex-end;
      justify-content: center;

      padding: 10px;

      background:
        rgba(0,0,0,.82);
    }


    .modal.open {
      display: flex;
    }


    .modal-box {
      position: relative;

      width: 100%;

      max-height: 92vh;

      overflow-y: auto;

      padding: 20px;

      border:
        1px solid var(--line);

      border-radius:
        22px 22px 12px 12px;

      background:
        var(--surface);

      box-shadow:
        0 20px 70px
        rgba(0,0,0,.55);
    }


    .modal-close {
      position: absolute;

      top: 12px;
      right: 12px;

      z-index: 2;

      display: flex;

      align-items: center;
      justify-content: center;

      width: 40px;
      height: 40px;

      padding: 0;

      border:
        1px solid #555;

      border-radius: 50%;

      background: #111;

      color: #fff;

      font-size: 24px;

      cursor: pointer;
    }


    .modal-content {
      display: grid;

      grid-template-columns:
        1fr;

      gap: 18px;
    }


    .modal-cover {
      display: block;

      width: auto;

      max-width:
        min(80%,300px);

      max-height: 46vh;

      margin:
        0 auto;

      object-fit: contain;

      border-radius: 10px;
    }


    .modal-title {
      margin:
        0 48px 14px 0;

      color:
        var(--text);

      font-size: 26px;
      font-weight: 800;

      line-height: 1.3;
    }


    .chips {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 12px;
    }


    .chip {
      padding:
        8px 12px;

      border:
        1px solid #3d3d3d;

      border-radius: 999px;

      background:
        var(--surface-2);

      color: #ddd;

      font-size: 15px;
    }


    .modal-price {
      margin:
        4px 0 20px;

      color:
        var(--accent);

      font-size: 19px;
      font-weight: 800;
    }


    .story-title {
      margin-bottom: 6px;

      color:
        var(--text);

      font-size: 17px;
      font-weight: 800;
    }


    .story {
      margin: 0;

      color:
        #d0cbc5;

      font-size: 16px;

      line-height: 1.7;

      white-space:
        pre-line;
    }


    /* ========================================
       DESKTOP
       ======================================== */

    @media (min-width:900px) {

      header {
        padding:
          38px 20px 18px;
      }


      header h1 {
        font-size: 58px;
      }


      main {
        width:
          min(960px,calc(100% - 48px));

        margin:
          0 auto;

        padding:
          0 0 80px;
      }


      /* FILTER */

      .filter-panel {
        padding: 16px;

        margin-bottom: 38px;
      }


      .search-box input {
        height: 48px;

        font-size: 16px;
      }


      .filter-row {
        grid-template-columns:
          repeat(4,minmax(0,1fr));

        gap: 10px;
      }


      .filter-select {
        height: 44px;

        font-size: 14px;
      }


      /* SERIES */

      .series {
        margin-top: 48px;
      }


      .series:first-child {
        margin-top: 0;
      }


      .series-banner {
        margin-bottom: 24px;

        padding:
          17px 20px;

        border-radius: 12px;
      }


      .series-banner h2 {
        font-size: 25px;
      }


      .series-count {
        font-size: 14px;
      }


      /* 4 GAMES PER ROW */

      .game-grid {
        grid-template-columns:
          repeat(4,minmax(0,1fr));

        column-gap: 26px;

        row-gap: 40px;
      }


      /*
       * ปกบนคอมสูงเท่ากัน 245px
       * แต่ความกว้างตามสัดส่วนจริง
       */

      .cover-area {
        height: 245px;
      }


      .cover {
        height: 245px;

        max-width: 100%;

        border-radius: 11px;
      }


      .cover:hover {
        transform:
          translateY(-4px);

        box-shadow:
          0 12px 30px
          rgba(0,0,0,.48);
      }


      .game-info {
        padding-top: 12px;
      }


      .game-title {
        font-size: 18px;

        line-height: 1.35;
      }


      .game-title:hover {
        color:
          var(--accent);
      }


      .game-meta {
        margin-top: 8px;

        font-size: 15px;

        line-height: 1.5;
      }


      .price {
        margin-top: 7px;

        font-size: 18px;
      }


      .coming-soon {
        margin-top: 10px;

        padding:
          6px 12px;

        font-size: 13px;
      }


      /* MODAL DESKTOP */

      .modal {
        align-items: center;

        padding: 20px;
      }


      .modal-box {
        width:
          min(900px,100%);

        max-height: 90vh;

        padding: 30px;

        border-radius: 20px;
      }


      .modal-content {
        grid-template-columns:
          minmax(0,320px) 1fr;

        gap: 32px;
      }


      .modal-cover {
        width: auto;

        max-width: 100%;

        max-height: 72vh;

        margin: 0 auto;
      }


      .modal-title {
        font-size: 32px;
      }


      .chip {
        font-size: 15px;
      }


      .modal-price {
        font-size: 21px;
      }


      .story-title {
        font-size: 18px;
      }


      .story {
        font-size: 16px;

        line-height: 1.75;
      }

    }

  </style>
</head>


<body>


<header>
  <h1>Game List</h1>
</header>


<main>

  <!-- =====================================
       FILTER
       ===================================== -->

  <div class="filter-panel">

    <div class="search-box">

      <input
        id="searchInput"
        type="search"
        placeholder="ค้นหาชื่อเกม..."
        autocomplete="off"
      >

    </div>


    <div class="filter-row">

      <select
        id="statusFilter"
        class="filter-select"
      >

        <option value="">
          ทุกสถานะ
        </option>

        <option value="active">
          พร้อมเล่น
        </option>

        <option value="coming soon">
          เร็ว ๆ นี้
        </option>

      </select>


      <select
        id="playerFilter"
        class="filter-select"
      >

        <option value="">
          ผู้เล่นทุกจำนวน
        </option>

      </select>


      <select
        id="timeFilter"
        class="filter-select"
      >

        <option value="">
          ทุกเวลา
        </option>

        <option value="3">
          ไม่เกิน 3 ชั่วโมง
        </option>

        <option value="4">
          4 ชั่วโมง
        </option>

        <option value="5">
          5 ชั่วโมงขึ้นไป
        </option>

      </select>


      <select
        id="seriesFilter"
        class="filter-select"
      >

        <option value="">
          ทุกหมวด
        </option>

      </select>

    </div>


    <div class="filter-footer">

      <div
        id="resultCount"
        class="result-count"
      ></div>


      <button
        id="resetFilters"
        class="reset-button"
        type="button"
      >
        ล้างตัวกรอง
      </button>

    </div>

  </div>


  <div id="catalog">

    <div class="message">
      กำลังโหลดรายการเกม...
    </div>

  </div>

</main>


<!-- =====================================
     MODAL
     ===================================== -->

<div
  class="modal"
  id="modal"
>

  <div class="modal-box">

    <button
      class="modal-close"
      id="closeButton"
      type="button"
      aria-label="ปิด"
    >
      ×
    </button>


    <div class="modal-content">

      <img
        id="modalCover"
        class="modal-cover"
        alt=""
      >


      <div>

        <h3
          id="modalTitle"
          class="modal-title"
        ></h3>


        <div class="chips">

          <span
            id="modalPlayers"
            class="chip"
          ></span>


          <span
            id="modalTime"
            class="chip"
          ></span>

        </div>


        <div
          id="modalPrice"
          class="modal-price"
        ></div>


        <div class="story-title">
          เรื่องย่อ
        </div>


        <p
          id="modalStory"
          class="story"
        ></p>

      </div>

    </div>

  </div>

</div>


<script>

  const API_URL =
    'https://script.google.com/macros/s/AKfycbw661bYeWAZN6KsjPgU_w53E_2AqtFOwZQC2YDIYsK9gUmeotr2Le3Y9HaI9qsel7id/exec';


  let allGames = [];


  const seriesOrder = [
    'mystery collection',
    'adventure',
    'mini',
    'party'
  ];


  loadGames();


  /* =====================================
     LOAD DATA
     ===================================== */

  async function loadGames() {

    try {

      const response =
        await fetch(API_URL);


      if (!response.ok) {

        throw new Error(
          'HTTP ' +
          response.status
        );

      }


      const data =
        await response.json();


      if (!data.success) {

        throw new Error(
          data.error ||
          'API Error'
        );

      }


      allGames =
        Array.isArray(data.games)
          ? data.games
          : [];


      setupFilters(
        allGames
      );


      applyFilters();

    }

    catch (error) {

      showError(error);

    }

  }


  /* =====================================
     FILTER OPTIONS
     ===================================== */

  function setupFilters(games) {

    setupPlayerOptions(games);

    setupSeriesOptions(games);

  }


  function setupPlayerOptions(games) {

    const numbers =
      new Set();


    games.forEach(
      function(game) {

        const range =
          parsePlayerRange(
            game.players
          );


        if (!range) {
          return;
        }


        for (
          let i = range.min;
          i <= range.max;
          i++
        ) {

          numbers.add(i);

        }

      }
    );


    const select =
      document.getElementById(
        'playerFilter'
      );


    [...numbers]
      .sort(
        function(a,b) {
          return a - b;
        }
      )
      .forEach(
        function(number) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            number;


          option.textContent =
            number +
            ' คน';


          select.appendChild(
            option
          );

        }
      );

  }


  function setupSeriesOptions(games) {

    const names =
      new Set();


    games.forEach(
      function(game) {

        const name =
          String(
            game.series || ''
          ).trim();


        if (name) {
          names.add(name);
        }

      }
    );


    const select =
      document.getElementById(
        'seriesFilter'
      );


    [...names]
      .sort(
        compareSeries
      )
      .forEach(
        function(name) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            name;


          option.textContent =
            name;


          select.appendChild(
            option
          );

        }
      );

  }


  /* =====================================
     FILTER EVENTS
     ===================================== */

  document
    .getElementById(
      'searchInput'
    )
    .addEventListener(
      'input',
      applyFilters
    );


  document
    .getElementById(
      'statusFilter'
    )
    .addEventListener(
      'change',
      applyFilters
    );


  document
    .getElementById(
      'playerFilter'
    )
    .addEventListener(
      'change',
      applyFilters
    );


  document
    .getElementById(
      'timeFilter'
    )
    .addEventListener(
      'change',
      applyFilters
    );


  document
    .getElementById(
      'seriesFilter'
    )
    .addEventListener(
      'change',
      applyFilters
    );


  document
    .getElementById(
      'resetFilters'
    )
    .addEventListener(
      'click',
      function() {

        document
          .getElementById(
            'searchInput'
          )
          .value = '';


        document
          .getElementById(
            'statusFilter'
          )
          .value = '';


        document
          .getElementById(
            'playerFilter'
          )
          .value = '';


        document
          .getElementById(
            'timeFilter'
          )
          .value = '';


        document
          .getElementById(
            'seriesFilter'
          )
          .value = '';


        applyFilters();

      }
    );


  /* =====================================
     APPLY FILTERS
     ===================================== */

  function applyFilters() {

    const search =
      document
        .getElementById(
          'searchInput'
        )
        .value
        .trim()
        .toLowerCase();


    const status =
      document
        .getElementById(
          'statusFilter'
        )
        .value;


    const player =
      document
        .getElementById(
          'playerFilter'
        )
        .value;


    const time =
      document
        .getElementById(
          'timeFilter'
        )
        .value;


    const series =
      document
        .getElementById(
          'seriesFilter'
        )
        .value;


    const filtered =
      allGames.filter(
        function(game) {


          /* SEARCH */

          if (search) {

            const name =
              String(
                game.gameName || ''
              )
              .toLowerCase();


            if (
              !name.includes(
                search
              )
            ) {

              return false;

            }

          }


          /* STATUS */

          if (status) {

            if (
              normalizeStatus(
                game.status
              ) !==
              status
            ) {

              return false;

            }

          }


          /* PLAYER */

          if (player) {

            if (
              !gameSupportsPlayer(
                game.players,
                Number(player)
              )
            ) {

              return false;

            }

          }


          /* TIME */

          if (time) {

            if (
              !matchesTimeFilter(
                game.playTime,
                time
              )
            ) {

              return false;

            }

          }


          /* SERIES */

          if (series) {

            if (
              String(
                game.series || ''
              ).trim() !==
              series
            ) {

              return false;

            }

          }


          return true;

        }
      );


    document
      .getElementById(
        'resultCount'
      )
      .textContent =
        'พบ ' +
        filtered.length +
        ' เกม';


    renderCatalog(
      filtered
    );

  }


  /* =====================================
     PLAYER
     ===================================== */

  function parsePlayerRange(value) {

    const text =
      String(
        value || ''
      )
      .trim()
      .replace(
        /–|—/g,
        '-'
      );


    if (!text) {
      return null;
    }


    const numbers =
      text.match(
        /\d+/g
      );


    if (
      !numbers ||
      numbers.length === 0
    ) {

      return null;

    }


    const min =
      Number(
        numbers[0]
      );


    const max =
      numbers.length >= 2
        ? Number(numbers[1])
        : min;


    return {
      min:
        Math.min(min,max),

      max:
        Math.max(min,max)
    };

  }


  function gameSupportsPlayer(
    value,
    player
  ) {

    const range =
      parsePlayerRange(
        value
      );


    if (!range) {
      return false;
    }


    return (
      player >= range.min &&
      player <= range.max
    );

  }


  /* =====================================
     TIME
     ===================================== */

  function parseTime(value) {

    const match =
      String(
        value || ''
      )
      .replace(
        ',',
        '.'
      )
      .match(
        /\d+(\.\d+)?/
      );


    if (!match) {
      return null;
    }


    return Number(
      match[0]
    );

  }


  function matchesTimeFilter(
    value,
    filter
  ) {

    const hours =
      parseTime(value);


    if (
      hours === null
    ) {

      return false;

    }


    if (
      filter === '3'
    ) {

      return hours <= 3;

    }


    if (
      filter === '4'
    ) {

      return (
        hours >= 3.5 &&
        hours < 5
      );

    }


    if (
      filter === '5'
    ) {

      return hours >= 5;

    }


    return true;

  }


  /* =====================================
     SORT
     ===================================== */

  function normalizeStatus(
    status
  ) {

    return String(
      status || ''
    )
    .trim()
    .toLowerCase();

  }


  function getStatusRank(
    status
  ) {

    const value =
      normalizeStatus(
        status
      );


    if (
      value ===
      'active'
    ) {

      return 0;

    }


    if (
      value ===
      'coming soon'
    ) {

      return 1;

    }


    return 2;

  }


  function compareGameId(
    a,
    b
  ) {

    return String(
      a || ''
    )
    .localeCompare(
      String(
        b || ''
      ),
      undefined,
      {
        numeric: true,
        sensitivity: 'base'
      }
    );

  }


  function sortGames(
    games
  ) {

    return [...games]
      .sort(
        function(a,b) {

          const statusDiff =
            getStatusRank(
              a.status
            ) -
            getStatusRank(
              b.status
            );


          if (
            statusDiff !== 0
          ) {

            return statusDiff;

          }


          return compareGameId(
            a.gameId,
            b.gameId
          );

        }
      );

  }


  function normalizeSeries(
    value
  ) {

    return String(
      value || ''
    )
    .trim()
    .toLowerCase();

  }


  function compareSeries(
    a,
    b
  ) {

    const aName =
      normalizeSeries(a);


    const bName =
      normalizeSeries(b);


    const aIndex =
      seriesOrder.indexOf(
        aName
      );


    const bIndex =
      seriesOrder.indexOf(
        bName
      );


    const aa =
      aIndex === -1
        ? 999
        : aIndex;


    const bb =
      bIndex === -1
        ? 999
        : bIndex;


    if (
      aa !== bb
    ) {

      return aa - bb;

    }


    return a.localeCompare(b);

  }


  /* =====================================
     CATALOG
     ===================================== */

  function renderCatalog(
    games
  ) {

    const catalog =
      document.getElementById(
        'catalog'
      );


    catalog.innerHTML = '';


    if (!games.length) {

      catalog.innerHTML =
        '<div class="message">' +
        'ไม่พบเกมที่ตรงกับตัวกรอง' +
        '</div>';


      return;

    }


    const seriesMap = {};


    sortGames(games)
      .forEach(
        function(game) {

          const name =
            String(
              game.series || ''
            ).trim();


          if (!name) {
            return;
          }


          if (
            !seriesMap[name]
          ) {

            seriesMap[name] =
              [];

          }


          seriesMap[name]
            .push(game);

        }
      );


    Object
      .keys(seriesMap)
      .sort(
        compareSeries
      )
      .forEach(
        function(seriesName) {

          createSeries(
            catalog,
            seriesName,
            seriesMap[
              seriesName
            ]
          );

        }
      );

  }


  /* =====================================
     SERIES
     ===================================== */

  function createSeries(
    catalog,
    seriesName,
    games
  ) {

    const section =
      document.createElement(
        'section'
      );


    section.className =
      'series';


    const banner =
      document.createElement(
        'div'
      );


    banner.className =
      'series-banner';


    const title =
      document.createElement(
        'h2'
      );


    title.textContent =
      seriesName;


    const count =
      document.createElement(
        'span'
      );


    count.className =
      'series-count';


    count.textContent =
      games.length +
      ' เรื่อง';


    banner.appendChild(
      title
    );


    banner.appendChild(
      count
    );


    const grid =
      document.createElement(
        'div'
      );


    grid.className =
      'game-grid';


    sortGames(games)
      .forEach(
        function(game) {

          grid.appendChild(
            createGameCard(
              game
            )
          );

        }
      );


    section.appendChild(
      banner
    );


    section.appendChild(
      grid
    );


    catalog.appendChild(
      section
    );

  }


  /* =====================================
     GAME CARD
     ===================================== */

  function createGameCard(
    game
  ) {

    const card =
      document.createElement(
        'article'
      );


    card.className =
      'game-card';


    /* COVER AREA */

    const coverArea =
      document.createElement(
        'div'
      );


    coverArea.className =
      'cover-area';


    /* COVER */

    const cover =
      document.createElement(
        'div'
      );


    cover.className =
      'cover';


    const img =
      document.createElement(
        'img'
      );


    img.alt =
      String(
        game.gameName || ''
      );


    img.loading =
      'lazy';


    setCoverImage(
      img,
      game.gameId
    );


    cover.appendChild(
      img
    );


    coverArea.appendChild(
      cover
    );


    /* INFO */

    const info =
      document.createElement(
        'div'
      );


    info.className =
      'game-info';


    const title =
      document.createElement(
        'div'
      );


    title.className =
      'game-title';


    title.textContent =
      String(
        game.gameName || ''
      );


    const meta =
      document.createElement(
        'div'
      );


    meta.className =
      'game-meta';


    const players =
      document.createElement(
        'div'
      );


    players.textContent =
      'ผู้เล่น ' +
      String(
        game.players || ''
      ) +
      ' คน';


    const time =
      document.createElement(
        'div'
      );


    time.textContent =
      'เวลา ' +
      String(
        game.playTime || ''
      ) +
      ' ชั่วโมง';


    meta.appendChild(
      players
    );


    meta.appendChild(
      time
    );


    const price =
      document.createElement(
        'div'
      );


    price.className =
      'price';


    price.textContent =
      formatPrice(
        game.price
      );


    info.appendChild(
      title
    );


    info.appendChild(
      meta
    );


    info.appendChild(
      price
    );


    if (
      normalizeStatus(
        game.status
      ) ===
      'coming soon'
    ) {

      const badge =
        document.createElement(
          'div'
        );


      badge.className =
        'coming-soon';


      badge.textContent =
        'เร็ว ๆ นี้';


      info.appendChild(
        badge
      );

    }


    cover.addEventListener(
      'click',
      function() {

        openModal(game);

      }
    );


    title.addEventListener(
      'click',
      function() {

        openModal(game);

      }
    );


    card.appendChild(
      coverArea
    );


    card.appendChild(
      info
    );


    return card;

  }


  /* =====================================
     COVER IMAGE
     ===================================== */

  function setCoverImage(
    img,
    gameId
  ) {

    const id =
      String(
        gameId || ''
      ).trim();


    const extensions = [
      'webp',
      'png',
      'jpg',
      'jpeg',
      'WEBP',
      'PNG',
      'JPG',
      'JPEG'
    ];


    let index = 0;


    function tryNext() {

      if (
        index >=
        extensions.length
      ) {

        img.removeAttribute(
          'src'
        );


        img.alt =
          'No image';


        return;

      }


      img.src =
        'covers/' +
        encodeURIComponent(id) +
        '.' +
        extensions[index];


      index++;

    }


    img.onerror =
      tryNext;


    tryNext();

  }


  /* =====================================
     MODAL
     ===================================== */

  function openModal(
    game
  ) {

    document
      .getElementById(
        'modalTitle'
      )
      .textContent =
        String(
          game.gameName || ''
        );


    document
      .getElementById(
        'modalPlayers'
      )
      .textContent =
        'ผู้เล่น ' +
        String(
          game.players || ''
        ) +
        ' คน';


    document
      .getElementById(
        'modalTime'
      )
      .textContent =
        'เวลา ' +
        String(
          game.playTime || ''
        ) +
        ' ชั่วโมง';


    document
      .getElementById(
        'modalPrice'
      )
      .textContent =
        formatPrice(
          game.price
        );


    document
      .getElementById(
        'modalStory'
      )
      .textContent =
        String(
          game.synopsis || ''
        );


    const cover =
      document.getElementById(
        'modalCover'
      );


    cover.alt =
      String(
        game.gameName || ''
      );


    setCoverImage(
      cover,
      game.gameId
    );


    document
      .getElementById(
        'modal'
      )
      .classList.add(
        'open'
      );


    document.body.style.overflow =
      'hidden';

  }


  function closeModal() {

    document
      .getElementById(
        'modal'
      )
      .classList.remove(
        'open'
      );


    document.body.style.overflow =
      '';

  }


  document
    .getElementById(
      'closeButton'
    )
    .addEventListener(
      'click',
      closeModal
    );


  document
    .getElementById(
      'modal'
    )
    .addEventListener(
      'click',
      function(event) {

        if (
          event.target.id ===
          'modal'
        ) {

          closeModal();

        }

      }
    );


  document.addEventListener(
    'keydown',
    function(event) {

      if (
        event.key ===
        'Escape'
      ) {

        closeModal();

      }

    }
  );


  /* =====================================
     PRICE
     ===================================== */

  function formatPrice(
    value
  ) {

    const cleaned =
      String(
        value || ''
      )
      .replace(
        /,/g,
        ''
      )
      .trim();


    const number =
      Number(
        cleaned
      );


    if (
      !cleaned ||
      isNaN(number)
    ) {

      return '';

    }

return (
  number.toLocaleString(
    'th-TH'
  ) +
  ' / รอบ'
);

  }


  /* =====================================
     ERROR
     ===================================== */

  function showError(
    error
  ) {

    const message =
      error &&
      error.message

        ? error.message

        : String(error);


    document
      .getElementById(
        'catalog'
      )
      .innerHTML =

        '<div class="message error">' +

        'โหลดข้อมูลไม่สำเร็จ: ' +

        escapeHtml(
          message
        ) +

        '</div>';

  }


  function escapeHtml(
    value
  ) {

    return String(
      value || ''
    )

      .replace(
        /&/g,
        '&amp;'
      )

      .replace(
        /</g,
        '&lt;'
      )

      .replace(
        />/g,
        '&gt;'
      )

      .replace(
        /"/g,
        '&quot;'
      )

      .replace(
        /'/g,
        '&#039;'
      );

  }

</script>
