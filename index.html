<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101010" />
  <title>Murder Mystery Catalog</title>

  <style>
    :root {
      --bg: #101010;
      --surface: #191919;
      --surface-2: #222222;
      --line: #303030;
      --text: #f5f5f5;
      --muted: #b9b9b9;
      --accent: #d6ae63;
      --ready: #5eaa72;
      --soon: #d7aa4c;
      --preparing: #5d8fc9;
      --maintenance: #c86666;
      --radius: 20px;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(
          circle at top,
          rgba(214, 174, 99, 0.08),
          transparent 30%
        ),
        var(--bg);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .page {
      width: min(1180px, calc(100% - 24px));
      margin: 0 auto;
    }

    .hero {
      padding: 28px 0 18px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4.2rem);
      line-height: 0.95;
      letter-spacing: -0.045em;
    }

    .intro {
      max-width: 700px;
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .controls-shell {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 10px 0 14px;

      background: linear-gradient(
        180deg,
        rgba(16, 16, 16, 0.98) 0%,
        rgba(16, 16, 16, 0.94) 78%,
        rgba(16, 16, 16, 0) 100%
      );

      backdrop-filter: blur(8px);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 210px;
      gap: 10px;
    }

    .search,
    .filter {
      width: 100%;
      min-height: 48px;

      border: 1px solid var(--line);
      border-radius: 14px;

      background: rgba(25, 25, 25, 0.96);
      color: var(--text);

      padding: 0 15px;

      outline: none;
    }

    .search:focus,
    .filter:focus {
      border-color: var(--accent);

      box-shadow:
        0 0 0 3px rgba(214, 174, 99, 0.12);
    }

    .count {
      margin: 4px 0 18px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .catalog {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 22px;

      padding-bottom: 42px;
    }

    .game-card {
      overflow: hidden;

      border: 1px solid var(--line);
      border-radius: var(--radius);

      background:
        linear-gradient(
          180deg,
          var(--surface-2),
          var(--surface)
        );

      box-shadow: var(--shadow);
    }

    .cover-shell {
      position: relative;

      width: 100%;

      min-height: 220px;

      background:
        linear-gradient(
          135deg,
          rgba(214, 174, 99, 0.12),
          transparent 60%
        ),
        #151515;

      display: grid;

      place-items: center;

      overflow: hidden;
    }

    .cover-image {
      width: 100%;
      height: auto;

      max-height: 720px;

      display: block;

      object-fit: contain;

      background: #111111;
    }

    .cover-placeholder {
      min-height: 300px;

      width: 100%;

      display: grid;

      place-items: center;

      padding: 28px;

      text-align: center;

      color: #888888;

      font-weight: 700;

      letter-spacing: 0.04em;
    }

    .status-badge {
      position: absolute;

      left: 14px;
      bottom: 14px;

      z-index: 2;

      padding: 8px 13px;

      border-radius: 999px;

      background:
        rgba(215, 170, 76, 0.96);

      color: #171717;

      font-size: 0.9rem;

      font-weight: 900;

      letter-spacing: 0.02em;

      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.28);

      backdrop-filter: blur(8px);
    }

    .card-body {
      padding: 20px;
    }

    .genre {
      color: var(--accent);

      font-size: 0.82rem;

      font-weight: 800;

      margin-bottom: 8px;
    }

    .title {
      margin: 0;

      font-size:
        clamp(1.4rem, 3vw, 2rem);

      line-height: 1.2;

      letter-spacing: -0.02em;
    }

    .meta {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin:
        14px 0 16px;
    }

    .tag {
      border:
        1px solid var(--line);

      border-radius:
        999px;

      background:
        #262626;

      color:
        #dddddd;

      padding:
        7px 10px;

      font-size:
        0.86rem;
    }

    .summary {
      margin: 0;

      color:
        var(--muted);

      line-height:
        1.72;

      white-space:
        pre-line;
    }

    .characters {
      margin-top:
        16px;

      color:
        #dddddd;

      line-height:
        1.6;

      font-size:
        0.94rem;
    }

    .price-row {
      display:
        flex;

      align-items:
        end;

      justify-content:
        space-between;

      gap:
        14px;

      margin-top:
        18px;

      padding-top:
        16px;

      border-top:
        1px solid var(--line);
    }

    .price-label {
      color:
        var(--muted);

      font-size:
        0.8rem;

      margin-bottom:
        3px;
    }

    .price {
      color:
        var(--accent);

      font-size:
        1.25rem;

      font-weight:
        900;
    }

    .price-muted {
      color:
        var(--muted);
    }

    .state {
      grid-column:
        1 / -1;

      border:
        1px solid var(--line);

      border-radius:
        var(--radius);

      background:
        var(--surface);

      color:
        var(--muted);

      padding:
        28px;

      text-align:
        center;
    }

    .state strong {
      display:
        block;

      color:
        var(--text);

      margin-bottom:
        6px;
    }

    footer {
      color:
        #777777;

      text-align:
        center;

      font-size:
        0.82rem;

      padding:
        0 0 28px;
    }

    @media (max-width: 760px) {

      .page {
        width:
          min(100% - 16px, 1180px);
      }

      .hero {
        padding-top:
          22px;
      }

      .controls {
        grid-template-columns:
          1fr;
      }

      .catalog {
        grid-template-columns:
          1fr;

        gap:
          16px;
      }

      .game-card {
        border-radius:
          16px;
      }

      .card-body {
        padding:
          17px;
      }

      .cover-image {
        max-height:
          none;
      }

      .cover-placeholder {
        min-height:
          260px;
      }

    }
  </style>
</head>

<body>

  <div class="page">

    <section class="hero">

      <div class="eyebrow">
        Murder Mystery
      </div>

      <h1>
        Game Catalog
      </h1>

      <p class="intro">
        รวมเกมที่พร้อมให้เล่น เกมที่กำลังจะเปิด และเกมที่อยู่ระหว่างเตรียมการ
      </p>

    </section>


    <section class="controls-shell">

      <div class="controls">

        <input
          id="searchInput"
          class="search"
          type="search"
          placeholder="ค้นหาชื่อเรื่อง แนวเกม หรือเรื่องย่อ..."
          autocomplete="off"
        />

        <select
          id="statusFilter"
          class="filter"
        >

          <option value="">
            ทุกสถานะ
          </option>

          <option value="พร้อมให้เล่น">
            พร้อมให้เล่น
          </option>

          <option value="เร็ว ๆ นี้">
            เร็ว ๆ นี้
          </option>

          <option value="กำลังเตรียมเกม">
            กำลังเตรียมเกม
          </option>

          <option value="ปิดปรับปรุง">
            ปิดปรับปรุง
          </option>

        </select>

      </div>

    </section>


    <p
      id="summaryLine"
      class="count"
    >
      กำลังโหลดข้อมูล...
    </p>


    <main
      id="catalog"
      class="catalog"
    >

      <div class="state">

        <strong>
          กำลังโหลดแคตตาล็อก
        </strong>

        กรุณารอสักครู่

      </div>

    </main>


    <footer>
      ข้อมูลในหน้านี้ดึงจาก Google Sheets
    </footer>

  </div>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbw661bYeWAZN6KsjPgU_w53E_2AqtFOwZQC2YDIYsK9gUmeotr2Le3Y9HaI9qsel7id/exec";


    const catalog =
      document.getElementById("catalog");

    const searchInput =
      document.getElementById("searchInput");

    const statusFilter =
      document.getElementById("statusFilter");

    const summaryLine =
      document.getElementById("summaryLine");


    let allGames = [];


    function normalizeText(value) {

      return String(value || "")
        .trim()
        .toLowerCase();

    }


    function escapeHtml(value) {

      return String(value || "")

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

    }


    function formatPrice(value) {

      const text =
        String(value || "")
          .replace(/,/g, "")
          .trim();


      const number =
        Number(text);


      if (
        !text ||
        Number.isNaN(number)
      ) {

        return "";

      }


      return new Intl.NumberFormat(
        "th-TH"
      ).format(number);

    }


    function shouldShowPrice(game) {

      const value =
        normalizeText(
          game.price_display
        );


      return (

        value === "แสดงราคา" ||

        value === "show" ||

        value === "true" ||

        value === "yes"

      );

    }


    function getPriceText(game) {

      if (
        game.status === "เร็ว ๆ นี้"
      ) {

        return "เปิดให้เล่นเร็ว ๆ นี้";

      }


      if (
        game.status === "กำลังเตรียมเกม"
      ) {

        return "อยู่ระหว่างเตรียมเกม";

      }


      if (
        game.status === "ปิดปรับปรุง"
      ) {

        return "ปิดปรับปรุงชั่วคราว";

      }


      if (
        !shouldShowPrice(game)
      ) {

        return "สอบถามราคา";

      }


      const price =
        formatPrice(game.price);


      return price
        ? `${price} บาท/คน`
        : "สอบถามราคา";

    }


    function getPriceLabel(game) {

      return game.status === "พร้อมให้เล่น"
        ? "ราคา"
        : "สถานะ";

    }


    /*
      =========================================
      เรียงลำดับเกม
      =========================================

      1. เกมพร้อมให้เล่น / Active มาก่อน
      2. จากนั้นเรียงตาม Game ID
      3. เกมสถานะอื่นตามหลัง
    */

    function sortGames(a, b) {

      const statusA =
        normalizeText(a.status);

      const statusB =
        normalizeText(b.status);


      const activeA =
        statusA === "พร้อมให้เล่น" ||
        statusA === "active";


      const activeB =
        statusB === "พร้อมให้เล่น" ||
        statusB === "active";


      /*
        ถ้าสถานะต่างกัน
        เกม Active ขึ้นก่อน
      */

      if (activeA !== activeB) {

        return activeA
          ? -1
          : 1;

      }


      /*
        รองรับชื่อ field Game ID
        หลายแบบ เผื่อ Apps Script
        ส่งชื่อมาไม่เหมือนกัน
      */

      const idA =

        a.gameId ??

        a.game_id ??

        a["Game ID"] ??

        a.id ??

        "";


      const idB =

        b.gameId ??

        b.game_id ??

        b["Game ID"] ??

        b.id ??

        "";


      /*
        เรียง ID แบบตัวเลขธรรมชาติ

        เช่น

        mmc01
        mmc02
        mmc02_5
        mmc03
      */

      return String(idA)
        .localeCompare(

          String(idB),

          undefined,

          {
            numeric: true,
            sensitivity: "base"
          }

        );

    }


    function createGameCard(game) {

      const article =
        document.createElement(
          "article"
        );


      article.className =
        "game-card";


      const coverHtml =
        game.cover

          ? `

            <img

              class="cover-image"

              src="${escapeHtml(game.cover)}"

              alt="หน้าปก ${escapeHtml(game.title)}"

              loading="lazy"

              onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='grid';
              "

            />

            <div
              class="cover-placeholder"
              style="display:none;"
            >
              ยังไม่มีรูปหน้าปก
            </div>

          `

          : `

            <div class="cover-placeholder">
              ยังไม่มีรูปหน้าปก
            </div>

          `;


      const difficultyTag =
        game.difficulty

          ? `

            <span class="tag">

              ความยาก:
              ${escapeHtml(game.difficulty)}

            </span>

          `

          : "";


      const charactersHtml =
        game.characters

          ? `

            <div class="characters">

              <strong>
                ตัวละคร:
              </strong>

              ${escapeHtml(game.characters)}

            </div>

          `

          : "";


      const priceClass =

        game.status === "พร้อมให้เล่น"

          ? "price"

          : "price price-muted";


      const statusBadge =

        game.status === "เร็ว ๆ นี้"

          ? `

            <div class="status-badge">
              เร็ว ๆ นี้
            </div>

          `

          : "";


      article.innerHTML = `

        <div class="cover-shell">

          ${coverHtml}

          ${statusBadge}

        </div>


        <div class="card-body">


          <div class="genre">

            ${escapeHtml(
              game.genre ||
              "Murder Mystery"
            )}

          </div>


          <h2 class="title">

            ${escapeHtml(
              game.title ||
              "ไม่มีชื่อเรื่อง"
            )}

          </h2>


          <div class="meta">


            <span class="tag">

              ผู้เล่น
              ${escapeHtml(
                game.players ||
                "-"
              )}
              คน

            </span>


            <span class="tag">

              ${escapeHtml(
                game.duration ||
                "ไม่ระบุเวลา"
              )}

            </span>


            ${difficultyTag}


          </div>


          <p class="summary">

            ${escapeHtml(
              game.summary ||
              "ยังไม่มีเรื่องย่อ"
            )}

          </p>


          ${charactersHtml}


          <div class="price-row">

            <div>


              <div class="price-label">

                ${escapeHtml(
                  getPriceLabel(game)
                )}

              </div>


              <div class="${priceClass}">

                ${escapeHtml(
                  getPriceText(game)
                )}

              </div>


            </div>

          </div>


        </div>

      `;


      return article;

    }


    function renderGames() {

      const keyword =
        normalizeText(
          searchInput.value
        );


      const selectedStatus =
        statusFilter.value;


      /*
        Filter ก่อน
      */

      const filteredGames =
        allGames.filter(
          (game) => {


            const searchableText =
              normalizeText([

                game.title,

                game.summary,

                game.genre,

                game.players,

                game.duration,

                game.difficulty,

                game.status,

                game.price_display,

                game.gameId,

                game.game_id,

                game["Game ID"]

              ].join(" "));


            const matchesKeyword =

              !keyword ||

              searchableText.includes(
                keyword
              );


            const matchesStatus =

              !selectedStatus ||

              game.status ===
                selectedStatus;


            return (

              matchesKeyword &&

              matchesStatus

            );

          }
        );


      /*
        =================================
        เรียงเกมตรงนี้
        =================================

        Active ก่อน
        แล้วตาม Game ID
      */

      filteredGames.sort(
        sortGames
      );


      catalog.innerHTML =
        "";


      if (
        filteredGames.length === 0
      ) {


        catalog.innerHTML = `

          <div class="state">

            <strong>

              ไม่พบเกมที่ตรงกับเงื่อนไข

            </strong>

            ลองเปลี่ยนคำค้นหา
            หรือตัวกรองสถานะ

          </div>

        `;


      } else {


        filteredGames.forEach(
          (game) => {

            catalog.appendChild(
              createGameCard(game)
            );

          }
        );


      }


      summaryLine.textContent =

        filteredGames.length ===
        allGames.length

          ? `ทั้งหมด ${allGames.length} เกม`

          : `พบ ${filteredGames.length} จากทั้งหมด ${allGames.length} เกม`;

    }


    async function loadGames() {


      if (

        !API_URL ||

        API_URL.includes(
          "วาง_WEB_APP_URL"
        ) ||

        !API_URL.endsWith(
          "/exec"
        )

      ) {


        catalog.innerHTML = `

          <div class="state">

            <strong>

              ยังไม่ได้ใส่ Web App URL

            </strong>

            กรุณาใส่ Web App URL
            ที่ลงท้ายด้วย /exec

          </div>

        `;


        summaryLine.textContent =
          "ยังไม่ได้เชื่อมต่อ Google Sheets";


        return;

      }


      try {


        const response =
          await fetch(

            API_URL,

            {
              cache: "no-store"
            }

          );


        if (
          !response.ok
        ) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const data =
          await response.json();


        if (

          !data.success ||

          !Array.isArray(
            data.games
          )

        ) {

          throw new Error(

            data.message ||

            "รูปแบบข้อมูลไม่ถูกต้อง"

          );

        }


        /*
          =================================
          เอา Hidden ออก
          =================================

          รองรับทั้ง

          Hidden
          ซ่อน
        */

        allGames =
          data.games.filter(
            (game) => {


              const status =
                normalizeText(
                  game.status
                );


              return (

                status !== "hidden" &&

                status !== "ซ่อน"

              );

            }
          );


        /*
          เรียงไว้ตั้งแต่โหลดด้วย
        */

        allGames.sort(
          sortGames
        );


        renderGames();


      } catch (error) {


        console.error(
          error
        );


        catalog.innerHTML = `

          <div class="state">

            <strong>

              โหลดข้อมูลไม่สำเร็จ

            </strong>

            ตรวจสอบ Web App URL
            สิทธิ์การเข้าถึง
            และการเผยแพร่ Apps Script

          </div>

        `;


        summaryLine.textContent =
          "ไม่สามารถเชื่อมต่อข้อมูลได้";

      }

    }


    searchInput.addEventListener(
      "input",
      renderGames
    );


    statusFilter.addEventListener(
      "change",
      renderGames
    );


    loadGames();

  </script>

</body>
</html>
