<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Murder Mystery</title>

  <style>
    :root {
      --bg: #121212;
      --surface: #1c1c1c;
      --surface-2: #242424;
      --surface-3: #303030;
      --text: #f4f1eb;
      --muted: #aaa49c;
      --accent: #d65a6f;
      --line: #373737;
      --banner: #292929;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        Tahoma,
        sans-serif;
    }

    header {
      padding: 24px 16px 10px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      color: var(--text);
      font-size: 30px;
      font-weight: 800;
    }

    main {
      width: 100%;
      padding: 0 16px 60px;
    }

    .series {
      margin-top: 36px;
    }

    .series:first-child {
      margin-top: 24px;
    }

    .series-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      width: 100%;
      margin-bottom: 16px;
      padding: 14px 16px;

      border: 1px solid var(--line);
      border-radius: 10px;

      background: var(--banner);
      color: var(--white);
    }

    .series-banner h2 {
      margin: 0;
      color: var(--white);
      font-size: 23px;
      font-weight: 800;
      line-height: 1.2;
    }

    .series-count {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    /* MOBILE = 2 COLUMNS */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 14px;
      row-gap: 30px;
    }

    .game-card {
      min-width: 0;
    }

    .cover {
      width: 100%;
      aspect-ratio: 3 / 4;

      overflow: hidden;

      border: 1px solid #333;
      border-radius: 10px;

      background: var(--surface-2);

      box-shadow:
        0 5px 18px rgba(0,0,0,.32);

      cursor: pointer;

      transition:
        transform .18s ease,
        box-shadow .18s ease;
    }

    .cover:active {
      transform: scale(.985);
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .game-info {
      padding-top: 9px;
    }

    .game-title {
      color: var(--text);
      font-size: 18px;
      font-weight: 800;
      line-height: 1.3;
      cursor: pointer;
    }

    .game-meta {
      margin-top: 7px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .price {
      margin-top: 6px;
      color: var(--accent);
      font-size: 17px;
      font-weight: 800;
    }

    .coming-soon {
      display: inline-block;

      margin-top: 8px;
      padding: 6px 11px;

      border: 1px solid #555;
      border-radius: 999px;

      background: var(--surface-3);
      color: #ddd;

      font-size: 13px;
      font-weight: 700;
    }

    .message {
      padding: 80px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 16px;
    }

    .error {
      color: #ff7c8d;
    }

    /* MODAL MOBILE */
    .modal {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 9999;

      align-items: flex-end;
      justify-content: center;

      padding: 10px;

      background:
        rgba(0,0,0,.82);
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      position: relative;

      width: 100%;
      max-height: 92vh;

      overflow-y: auto;

      padding: 20px;

      border: 1px solid var(--line);

      border-radius:
        22px 22px 12px 12px;

      background: var(--surface);

      box-shadow:
        0 20px 70px rgba(0,0,0,.55);
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 40px;
      height: 40px;

      padding: 0;

      border: 1px solid #555;
      border-radius: 50%;

      background: #111;
      color: #fff;

      font-size: 24px;
      cursor: pointer;
    }

    .modal-content {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .modal-cover {
      display: block;
      width: min(70%, 300px);
      max-height: 46vh;
      margin: 0 auto;
      object-fit: contain;
      border-radius: 10px;
    }

    .modal-title {
      margin: 0 48px 14px 0;
      color: var(--text);
      font-size: 26px;
      font-weight: 800;
      line-height: 1.3;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .chip {
      padding: 8px 12px;
      border: 1px solid #3d3d3d;
      border-radius: 999px;
      background: var(--surface-2);
      color: #ddd;
      font-size: 15px;
    }

    .modal-price {
      margin: 4px 0 20px;
      color: var(--accent);
      font-size: 19px;
      font-weight: 800;
    }

    .story-title {
      margin-bottom: 6px;
      color: var(--text);
      font-size: 17px;
      font-weight: 800;
    }

    .story {
      margin: 0;
      color: #d0cbc5;
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-line;
    }

    /* DESKTOP */
    @media (min-width: 900px) {

      header {
        padding: 34px 20px 12px;
      }

      header h1 {
        font-size: 42px;
      }

      main {
        width: min(960px, calc(100% - 48px));
        margin: 0 auto;
        padding: 0 0 80px;
      }

      .series {
        margin-top: 48px;
      }

      .series:first-child {
        margin-top: 32px;
      }

      .series-banner {
        margin-bottom: 22px;
        padding: 17px 20px;
        border-radius: 12px;
      }

      .series-banner h2 {
        font-size: 25px;
      }

      .series-count {
        font-size: 14px;
      }

      .game-grid {
        grid-template-columns:
          repeat(4, minmax(0, 1fr));

        column-gap: 26px;
        row-gap: 38px;
      }

      .cover {
        border-radius: 12px;
      }

      .cover:hover {
        transform: translateY(-4px);

        box-shadow:
          0 12px 30px rgba(0,0,0,.48);
      }

      .game-info {
        padding-top: 12px;
      }

      .game-title {
        font-size: 18px;
        line-height: 1.35;
      }

      .game-title:hover {
        color: var(--accent);
      }

      .game-meta {
        margin-top: 8px;
        font-size: 15px;
        line-height: 1.5;
      }

      .price {
        margin-top: 7px;
        font-size: 18px;
      }

      .coming-soon {
        margin-top: 10px;
        padding: 6px 12px;
        font-size: 13px;
      }

      .modal {
        align-items: center;
        padding: 20px;
      }

      .modal-box {
        width: min(900px, 100%);
        max-height: 90vh;
        padding: 30px;
        border-radius: 20px;
      }

      .modal-close {
        top: 14px;
        right: 14px;
        width: 42px;
        height: 42px;
        font-size: 25px;
      }

      .modal-content {
        grid-template-columns:
          minmax(0, 320px) 1fr;

        gap: 32px;
      }

      .modal-cover {
        width: 100%;
        max-height: 72vh;
        margin: 0;
      }

      .modal-title {
        margin-right: 50px;
        font-size: 32px;
      }

      .chips {
        gap: 9px;
        margin-bottom: 15px;
      }

      .chip {
        padding: 8px 13px;
        font-size: 15px;
      }

      .modal-price {
        font-size: 21px;
      }

      .story-title {
        font-size: 18px;
      }

      .story {
        font-size: 16px;
        line-height: 1.75;
      }
    }

  </style>
</head>

<body>

<header>
  <h1>Murder Mystery</h1>
</header>

<main id="catalog">
  <div class="message">
    กำลังโหลดรายการเกม...
  </div>
</main>

<div
  class="modal"
  id="modal"
>
  <div class="modal-box">

    <button
      class="modal-close"
      id="closeButton"
      type="button"
      aria-label="ปิด"
    >
      ×
    </button>

    <div class="modal-content">

      <img
        id="modalCover"
        class="modal-cover"
        alt=""
      >

      <div>

        <h3
          id="modalTitle"
          class="modal-title"
        ></h3>

        <div class="chips">
          <span id="modalPlayers" class="chip"></span>
          <span id="modalTime" class="chip"></span>
        </div>

        <div
          id="modalPrice"
          class="modal-price"
        ></div>

        <div class="story-title">
          เรื่องย่อ
        </div>

        <p
          id="modalStory"
          class="story"
        ></p>

      </div>

    </div>

  </div>
</div>

<script>

  const API_URL =
    'https://script.google.com/macros/s/AKfycbw661bYeWAZN6KsjPgU_w53E_2AqtFOwZQC2YDIYsK9gUmeotr2Le3Y9HaI9qsel7id/exec';


  loadGames();


  async function loadGames() {

    try {

      const response =
        await fetch(API_URL);

      if (!response.ok) {
        throw new Error(
          'HTTP ' + response.status
        );
      }

      const data =
        await response.json();

      if (!data.success) {
        throw new Error(
          data.error || 'API Error'
        );
      }

      renderCatalog(
        data.games
      );

    }

    catch (error) {
      showError(error);
    }

  }


  function getStatusRank(status) {

    const value =
      String(status || '')
        .trim()
        .toLowerCase();

    if (value === 'active') {
      return 0;
    }

    if (value === 'coming soon') {
      return 1;
    }

    return 2;
  }


  function compareGameId(
    idA,
    idB
  ) {

    return String(idA || '')
      .localeCompare(
        String(idB || ''),
        undefined,
        {
          numeric: true,
          sensitivity: 'base'
        }
      );
  }


  function sortGames(games) {

    return [...games]
      .sort(
        function(a, b) {

          const statusDifference =
            getStatusRank(a.status) -
            getStatusRank(b.status);

          if (
            statusDifference !== 0
          ) {
            return statusDifference;
          }

          return compareGameId(
            a.gameId,
            b.gameId
          );
        }
      );
  }


  function normalizeSeriesName(name) {
    return String(name || '')
      .trim()
      .toLowerCase();
  }


  function renderCatalog(games) {

    const catalog =
      document.getElementById(
        'catalog'
      );

    catalog.innerHTML = '';

    if (
      !Array.isArray(games) ||
      games.length === 0
    ) {

      catalog.innerHTML =
        '<div class="message">' +
        'ยังไม่มีรายการเกม' +
        '</div>';

      return;
    }


    const sortedGames =
      sortGames(games);

    const seriesMap = {};


    sortedGames.forEach(
      function(game) {

        const seriesName =
          String(
            game.series || ''
          ).trim();

        if (!seriesName) {
          return;
        }

        if (!seriesMap[seriesName]) {
          seriesMap[seriesName] = [];
        }

        seriesMap[seriesName]
          .push(game);
      }
    );


    const seriesOrder = [
      'mystery collection',
      'adventure',
      'mini',
      'party'
    ];


    /* หมวดที่กำหนดไว้ก่อน */

    seriesOrder.forEach(
      function(targetName) {

        const actualSeriesName =
          Object.keys(seriesMap)
            .find(
              function(seriesName) {
                return (
                  normalizeSeriesName(
                    seriesName
                  ) ===
                  targetName
                );
              }
            );


        if (actualSeriesName) {

          createSeries(
            catalog,
            actualSeriesName,
            seriesMap[
              actualSeriesName
            ]
          );

        }

      }
    );


    /* หมวดอื่น ๆ ต่อท้าย */

    Object.keys(seriesMap)
      .forEach(
        function(seriesName) {

          const normalized =
            normalizeSeriesName(
              seriesName
            );

          if (
            !seriesOrder.includes(
              normalized
            )
          ) {

            createSeries(
              catalog,
              seriesName,
              seriesMap[
                seriesName
              ]
            );

          }

        }
      );

  }


  function createSeries(
    catalog,
    seriesName,
    games
  ) {

    games =
      sortGames(games);


    const section =
      document.createElement(
        'section'
      );

    section.className =
      'series';


    const banner =
      document.createElement(
        'div'
      );

    banner.className =
      'series-banner';


    const heading =
      document.createElement(
        'h2'
      );

    heading.textContent =
      seriesName;


    const count =
      document.createElement(
        'span'
      );

    count.className =
      'series-count';

    count.textContent =
      games.length +
      ' เรื่อง';


    banner.appendChild(
      heading
    );

    banner.appendChild(
      count
    );


    const grid =
      document.createElement(
        'div'
      );

    grid.className =
      'game-grid';


    games.forEach(
      function(game) {

        grid.appendChild(
          createGameCard(
            game
          )
        );

      }
    );


    section.appendChild(
      banner
    );

    section.appendChild(
      grid
    );

    catalog.appendChild(
      section
    );


    setSeriesRatio(
      section
    );

  }


  function createGameCard(game) {

    const card =
      document.createElement(
        'article'
      );

    card.className =
      'game-card';


    const cover =
      document.createElement(
        'div'
      );

    cover.className =
      'cover';


    const img =
      document.createElement(
        'img'
      );

    img.alt =
      String(
        game.gameName || ''
      );

    img.loading =
      'lazy';


    setCoverImage(
      img,
      game.gameId
    );


    cover.appendChild(
      img
    );


    const info =
      document.createElement(
        'div'
      );

    info.className =
      'game-info';


    const title =
      document.createElement(
        'div'
      );

    title.className =
      'game-title';

    title.textContent =
      String(
        game.gameName || ''
      );


    const meta =
      document.createElement(
        'div'
      );

    meta.className =
      'game-meta';


    const players =
      document.createElement(
        'div'
      );

    players.textContent =
      'ผู้เล่น ' +
      String(
        game.players || ''
      ) +
      ' คน';


    const time =
      document.createElement(
        'div'
      );

    time.textContent =
      'เวลา ' +
      String(
        game.playTime || ''
      ) +
      ' ชั่วโมง';


    meta.appendChild(
      players
    );

    meta.appendChild(
      time
    );


    const price =
      document.createElement(
        'div'
      );

    price.className =
      'price';

    price.textContent =
      formatPrice(
        game.price
      );


    info.appendChild(
      title
    );

    info.appendChild(
      meta
    );

    info.appendChild(
      price
    );


    const status =
      String(
        game.status || ''
      )
      .trim()
      .toLowerCase();


    if (
      status ===
      'coming soon'
    ) {

      const badge =
        document.createElement(
          'div'
        );

      badge.className =
        'coming-soon';

      badge.textContent =
        'เร็ว ๆ นี้';

      info.appendChild(
        badge
      );
    }


    cover.addEventListener(
      'click',
      function() {
        openModal(game);
      }
    );


    title.addEventListener(
      'click',
      function() {
        openModal(game);
      }
    );


    card.appendChild(
      cover
    );

    card.appendChild(
      info
    );


    return card;
  }


  function setCoverImage(
    img,
    gameId
  ) {

    const id =
      String(
        gameId || ''
      ).trim();


    const extensions = [
      'webp',
      'png',
      'jpg',
      'jpeg',
      'WEBP',
      'PNG',
      'JPG',
      'JPEG'
    ];


    let index = 0;


    function tryNext() {

      if (
        index >=
        extensions.length
      ) {

        img.removeAttribute(
          'src'
        );

        img.alt =
          'No image';

        return;
      }


      img.src =
        'covers/' +
        encodeURIComponent(id) +
        '.' +
        extensions[index];


      index++;
    }


    img.onerror =
      tryNext;


    tryNext();
  }


  function setSeriesRatio(
    section
  ) {

    const covers =
      section.querySelectorAll(
        '.cover'
      );


    const images =
      section.querySelectorAll(
        '.cover img'
      );


    covers.forEach(
      function(cover) {
        cover.style.aspectRatio =
          '3 / 4';
      }
    );


    if (!images.length) {
      return;
    }


    const firstImage =
      images[0];


    function applyRatio() {

      if (
        !firstImage.naturalWidth ||
        !firstImage.naturalHeight
      ) {
        return;
      }


      const ratio =
        firstImage.naturalWidth +
        ' / ' +
        firstImage.naturalHeight;


      covers.forEach(
        function(cover) {

          cover.style.aspectRatio =
            ratio;

        }
      );
    }


    if (
      firstImage.complete &&
      firstImage.naturalWidth
    ) {

      applyRatio();

    }

    else {

      firstImage.addEventListener(
        'load',
        applyRatio,
        {
          once: true
        }
      );
    }
  }


  function openModal(game) {

    document
      .getElementById(
        'modalTitle'
      )
      .textContent =
        String(
          game.gameName || ''
        );


    document
      .getElementById(
        'modalPlayers'
      )
      .textContent =
        'ผู้เล่น ' +
        String(
          game.players || ''
        ) +
        ' คน';


    document
      .getElementById(
        'modalTime'
      )
      .textContent =
        'เวลา ' +
        String(
          game.playTime || ''
        ) +
        ' ชั่วโมง';


    document
      .getElementById(
        'modalPrice'
      )
      .textContent =
        formatPrice(
          game.price
        );


    document
      .getElementById(
        'modalStory'
      )
      .textContent =
        String(
          game.synopsis || ''
        );


    const cover =
      document.getElementById(
        'modalCover'
      );


    cover.style.display =
      'block';

    cover.alt =
      String(
        game.gameName || ''
      );


    setCoverImage(
      cover,
      game.gameId
    );


    document
      .getElementById(
        'modal'
      )
      .classList.add(
        'open'
      );


    document.body.style.overflow =
      'hidden';
  }


  function closeModal() {

    document
      .getElementById(
        'modal'
      )
      .classList.remove(
        'open'
      );

    document.body.style.overflow =
      '';
  }


  document
    .getElementById(
      'closeButton'
    )
    .addEventListener(
      'click',
      closeModal
    );


  document
    .getElementById(
      'modal'
    )
    .addEventListener(
      'click',
      function(event) {

        if (
          event.target.id ===
          'modal'
        ) {
          closeModal();
        }

      }
    );


  document.addEventListener(
    'keydown',
    function(event) {

      if (
        event.key ===
        'Escape'
      ) {
        closeModal();
      }

    }
  );


  function formatPrice(value) {

    const cleaned =
      String(
        value || ''
      )
      .replace(
        /,/g,
        ''
      )
      .trim();


    const number =
      Number(
        cleaned
      );


    if (
      !cleaned ||
      isNaN(number)
    ) {
      return '';
    }


    return (
      '฿' +
      number.toLocaleString(
        'th-TH'
      ) +
      ' / รอบ'
    );
  }


  function showError(error) {

    const message =
      error &&
      error.message
        ? error.message
        : String(error);


    document
      .getElementById(
        'catalog'
      )
      .innerHTML =
        '<div class="message error">' +
        'โหลดข้อมูลไม่สำเร็จ: ' +
        escapeHtml(message) +
        '</div>';
  }


  function escapeHtml(value) {

    return String(
      value || ''
    )

      .replace(
        /&/g,
        '&amp;'
      )

      .replace(
        /</g,
        '&lt;'
      )

      .replace(
        />/g,
        '&gt;'
      )

      .replace(
        /"/g,
        '&quot;'
      )

      .replace(
        /'/g,
        '&#039;'
      );
  }

</script>

</body>
</html>
